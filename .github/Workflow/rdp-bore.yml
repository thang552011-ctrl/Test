name: Kanda RDP Zero-Touch 24/7 (Watchdog & Defender Bypass)
​on:
workflow_dispatch:
inputs:
quick_test:
description: "Run 5-minute test"
type: boolean
default: false
runtime_minutes:
description: "Runtime (max 360; default 355)"
required: false
default: "355"
rdp_count:
description: "How many RDP instances (1-20)"
required: false
default: "1"
user_id:
description: "Workspace Bucket ID (UID Discord)"
required: false
default: "default_user"
​permissions:
contents: write
actions: write
​defaults:
run:
shell: pwsh
​jobs:
setup:
runs-on: ubuntu-latest
outputs:
matrix: ${{ steps.mk.outputs.matrix }}
steps:
- id: mk
run: |
n = [int]"{{ inputs.rdp_count }}"
if ($n -lt 1) {$n = 1 }
if ($n -gt 20) { $n = 20 }$inc = @()
for ($i=1; $i -le $n; $i++) { $inc += @{ id =$i } }
$json = (@{ include =$inc } | ConvertTo-Json -Compress)
"matrix=$json" >> $env:GITHUB_OUTPUT
​rdp:
needs: setup
runs-on: windows-latest
strategy:
matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
max-parallel: 4
timeout-minutes: 370
env:
RDP_USER: Kandagawa
RDP_PASS: Kandagw@12345
STATE_DIR: C:\KandaState
​steps:
- name: Decide hostname
run: |
if ([int]"${{ inputs.rdp_count }}" -gt 1) {
hn = "kanda{{ matrix.id }}"
} else {
$hn = "kanda"
}
"RDP_HOSTNAME=$hn" >> $env:GITHUB_ENV
Write-Host "Hostname: $hn"
​- name: Enable RDP user + Admin Rights
run: |
$secFile = "$env:TEMP\secedit.cfg"
$secNew = "$env:TEMP\secedit_new.cfg"
secedit /export /cfg $secFile /quiet 2>$null
if (Test-Path $secFile) {
(Get-Content secFile) -replace 'PasswordComplexity = 1','PasswordComplexity = 0' -replace 'MinimumPasswordLength = \d+','MinimumPasswordLength = 0' \vert{} Set-ContentsecNew
secedit /configure /db secedit.sdb /cfg $secNew /quiet 2>$null
}
$u =$env:RDP_USER
$p =$env:RDP_PASS
sec = ConvertTo-SecureStringp -AsPlainText -Force
if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
New-LocalUser -Name u -Passwordsec -AccountNeverExpires
Add-LocalGroupMember -Group "Administrators" -Member $u
Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
} else {
Set-LocalUser -Name u -Passwordsec -AccountNeverExpires
Enable-LocalUser -Name $u
Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
}
Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
​- name: Ultimate Performance & Total Windows Defender Bypass
run: |
try {
reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f | Out-Null
reg add "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" /v Win32PrioritySeparation /t REG_DWORD /d 38 /f | Out-Null
reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f | Out-Null
​Set-MpPreference -DisableRealtimeMonitoring $true -EA SilentlyContinue
Set-MpPreference -DisableBehaviorMonitoring $true -EA SilentlyContinue
Set-MpPreference -DisableScanOnRealtimeEnable $true -EA SilentlyContinue
Set-MpPreference -DisableIOAVProtection $true -EA SilentlyContinue
Set-MpPreference -DisableScriptScanning $true -EA SilentlyContinue
Set-MpPreference -DisableArchiveScanning $true -EA SilentlyContinue
Add-MpPreference -ExclusionPath "C:" -EA SilentlyContinue
Stop-Service -Name WinDefend -Force -EA SilentlyContinue
Stop-Service -Name WdNisSvc -Force -EA SilentlyContinue
Set-Service -Name WinDefend -StartupType Disabled -EA SilentlyContinue
Set-Service -Name WdNisSvc -StartupType Disabled -EA SilentlyContinue
Write-Host "[+] Windows Defender disabled & Full C:\ exclusion applied successfully."
} catch { Write-Host ("[!] Defender bypass notice: " + $_.Exception.Message) }
​- name: Zero-Touch Auto Restore & Watchdog Setup
env:
GH_TOKEN: ${{ github.token }}
USER_ID: ${{ inputs.user_id }}
run: |
$u = env:RDP_USERuserProfile = "C:\Users$u"
$stateDir = env:STATE_DIRtagName = "kanda-state-env:USER_ID-slot{{ matrix.id }}"
$zipFile = "$env:TEMP\kanda_state.7z"
​New-Item -ItemType Directory -Force -Path stateDir \vert{} Out-NulltargetDirs = @("$userProfile\Desktop", "$userProfile\Downloads", "$userProfile\Documents", "$userProfile\AppData\Roaming")
foreach ($d in targetDirs) { New-Item -ItemType Directory -Force -Pathd | Out-Null }
​Write-Host "[+] Cài đặt Tesseract OCR..."
try {
winget install UB-Mannheim.TesseractOCR --accept-source-agreements --accept-package-agreements -h 2>$null
} catch {}
​try {
