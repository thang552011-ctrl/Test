if (Test-Path zipFile) { 7z xzipFile -o"C:" -y | Out-Null
Remove-Item $zipFile -Force -EA SilentlyContinue
Write-Host "[+] Khôi phục thành công dữ liệu máy cũ!"
}
} catch {
Write-Host "[i] Khởi tạo máy mới hoàn toàn."
}
​icacls userProfile /grant "{u}:(OI)(CI)F" /T /Q 2>$null | Out-Null
​$watchdogScript = @"
param([string]`$AppPath)
Add-Type -AssemblyName System.Drawing
Add-Type -AssemblyName System.Windows.Forms
​function Invoke-OCRClick {
param([string]$targetWord) try { $screenshotPath = "$env:TEMP\screen_check.png" $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
$bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height $graphics = [System.Drawing.Graphics]::FromImage($bmp) $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
$bmp.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png) $graphics.Dispose() $bmp.Dispose()
​$tesseractOut = "$env:TEMP\ocr_res"
& "C:\Program Files\Tesseract-OCR\tesseract.exe" $screenshotPath $tesseractOut -l eng 2>$null $tsvFile = "$tesseractOut.tsv" if (Test-Path $tsvFile) {
foreach ($line in (Get-Content $tsvFile)) {
if ($line -match $targetWord) { $cols = $line -split "t" if ($cols.Length -ge 11) {
$x = [int]$cols[6]; $y = [int]$cols[7]; $w = [int]$cols[8]; $h = [int]$cols[9] $cx = $x + [math]::Floor($w / 2); $cy = $y + [math]::Floor($h / 2)
[System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point($cx, $cy) [System.Windows.Forms.SendKeys]::SendWait("{DOWN}") Start-Sleep -Milliseconds 300 return $true } } } } } catch {} return $false
}
​Start-Sleep -Seconds 10
$stateFile = "C:\KandaState\running_apps.json" while ($true) {
if (Test-Path $stateFile) { try { $apps = Get-Content $stateFile -Raw | ConvertFrom-Json foreach ($app in $apps) { if ($app.Path -and (Test-Path $app.Path)) { $procName = [System.IO.Path]::GetFileNameWithoutExtension($app.Path) if (-not (Get-Process -Name $procName -ErrorAction SilentlyContinue)) {
Start-Process -FilePath $app.Path -WindowStyle Hidden -ErrorAction SilentlyContinue Start-Sleep -Seconds 5 foreach ($kw in @("Login", "START")) { Invoke-OCRClick -targetWord `$kw; Start-Sleep -Seconds 2 }
}
}
}
} catch {}
}
Start-Sleep -Seconds 30
}
