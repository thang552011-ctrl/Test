​function Invoke-KandaSnapshot {
try {
$ignoreProcs = @("explorer","TextInputHost","ApplicationFrameHost","ShellExperienceHost","SearchHost","StartMenuExperienceHost","Taskmgr","cmd","powershell","pwsh","conhost","svchost","rdpclip","bore","7z","csrss","dwm","lsass","winlogon","wininit") $openApps = @()
Get-Process | Where-Object { $_.Path -and ($ignoreProcs -notcontains $_.ProcessName) } | ForEach-Object { openApps += @{ Name = `$_.ProcessName; Path = `_.Path; WorkDir = (Split-Path $_.Path -Parent) -as [string] } } $uniqueApps = $openApps | Sort-Object -Property Path -Unique if ($uniqueApps) { ConvertTo-Json -InputObject @($uniqueApps) -Depth 3 \vert{} Set-Content -Path "$stateDir\running_apps.json" -Encoding UTF8 }
​$includePaths = @() foreach ($p in @("$userProfile\Desktop", "$userProfile\Downloads", "$userProfile\Documents", "$userProfile\AppData\Roaming", "$stateDir\running_apps.json")) { if (Test-Path $p) { $includePaths += $p }
}
if ($includePaths.Count -gt 0) { Remove-Item $zipFile -Force -EA SilentlyContinue
7z a -t7z $zipFile $includePaths -spf -mx=1 -ssw -xr!"Cache" -xr!"Temp" -xr!"*.tmp" | Out-Null
if (Test-Path $zipFile) { gh release view $tagName 2>$null \vert{} Out-Null if ($LASTEXITCODE -ne 0) {
gh release create $tagName $zipFile --title "Auto State" --notes "Backup" 2>$null | Out-Null } else { gh release upload $tagName $zipFile --clobber 2>$null | Out-Null
}
}
}
} catch {}
}
​if ($args -eq "--once") { Invoke-KandaSnapshot } else { while ($true) { Start-Sleep -Seconds 180; Invoke-KandaSnapshot } }
